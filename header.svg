<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Cyber Neon Border Gradient -->
    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Subtle Engineering Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Radial Accent Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Center Glow -->
  <circle cx="600" cy="160" r="280" fill="url(#ambient-glow)"/>

  <!-- Neon Border Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#neon-border)" stroke-width="1.5" opacity="0.85"/>

  <!-- Corner Tech Accents -->
  <path d="M 18 36 L 18 18 L 36 18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1182 36 L 1182 18 L 1164 18" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 18 284 L 18 302 L 36 302" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1182 284 L 1182 302 L 1164 302" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>

  <!-- System Badge -->
  <g transform="translate(480, 48)">
    <rect width="240" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
    <circle cx="18" cy="14" r="4" fill="#22c55e"/>
    <text x="32" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="2">SYSTEMS ARCHITECT</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="148" text-anchor="middle" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="4">MARCOS LAUDÉRIO</text>

  <!-- Subtitle -->
  <text x="600" y="192" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="600" letter-spacing="3.5">SENIOR FULL-STACK ENGINEER &amp; SYSTEMS ARCHITECT</text>

  <!-- Bottom Specs Telemetry Line -->
  <g transform="translate(100, 245)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1" opacity="0.6"/>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12">OS: <tspan fill="#38bdf8" font-weight="600">ZORIN LINUX</tspan></text>
    <text x="500" y="24" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12">STACK: <tspan fill="#e2e8f0" font-weight="600">TS · NEXT.JS · NODE · PHP · LARAVEL · POSTGRES</tspan></text>
    <text x="1000" y="24" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12">STATUS: <tspan fill="#22c55e" font-weight="600">ACTIVE // ONLINE</tspan></text>
  </g>
</svg>
